version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: postgres_local
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: salingtau_admin
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
